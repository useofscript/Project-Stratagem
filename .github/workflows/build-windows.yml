name: Build Project Stratagem for Windows
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller
      - name: Build GUI executable
        run: pyinstaller --noconfirm --clean --onefile --windowed --name Project-Stratagem app.py
      - uses: actions/upload-artifact@v4
        with:
          name: Project-Stratagem-Windows
          path: dist/Project-Stratagem.exe
          retention-days: 30
