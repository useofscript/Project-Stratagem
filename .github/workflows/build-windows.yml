name: Build Project Stratagem Windows App

on:
  workflow_dispatch:
  release:
    types: [published]
  pull_request:
    branches:
      - main
  push:
    tags:
      - "0.*"
      - "v0.*"
    branches:
      - main

permissions:
  contents: write

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check Rust project
        run: cargo check --release

      - name: Run tests
        run: cargo test --release

      - name: Build Windows GUI executable
        run: cargo build --release

      - name: Package portable app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/Project-Stratagem.exe dist/Project-Stratagem.exe
          Copy-Item README.md dist/README.txt
          Compress-Archive -Path dist/Project-Stratagem.exe, dist/README.txt -DestinationPath dist/Project-Stratagem-Windows-Portable.zip -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Project-Stratagem-Windows-Portable
          path: dist/*
          retention-days: 30

      - name: Attach executable to GitHub Release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || (startsWith(github.ref, 'refs/tags/') && github.ref_name || '0.2.0') }}
        shell: pwsh
        run: |
          gh release upload "$env:RELEASE_TAG" dist/Project-Stratagem.exe dist/Project-Stratagem-Windows-Portable.zip dist/README.txt --clobber
