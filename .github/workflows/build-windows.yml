name: Build Project Stratagem Windows App

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    tags:
      - "0.*"
      - "v0.*"
    branches:
      - main

permissions:
  contents: write

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Format Rust source
        run: cargo fmt --all

      - name: Check Rust project
        run: cargo check --release

      - name: Run tests
        run: cargo test --release

      - name: Build Windows GUI executable
        run: cargo build --release

      - name: Package portable app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/Project-Stratagem.exe dist/Project-Stratagem.exe
          Copy-Item README.md dist/README.txt
          Compress-Archive -Path dist/Project-Stratagem.exe, dist/README.txt -DestinationPath dist/Project-Stratagem-Windows-Portable.zip -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Project-Stratagem-Windows-Portable
          path: dist/*
          retention-days: 30

      - name: Create release and attach app assets
        if: startsWith(github.ref, 'refs/tags/') || (github.ref == 'refs/heads/main')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '0.3.1' }}
        shell: pwsh
        run: |
          gh release view "$env:RELEASE_TAG" --json tagName 2>$null
          if ($LASTEXITCODE -ne 0) {
            if ($env:GITHUB_REF -eq "refs/heads/main") {
              gh api "repos/$env:GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$env:RELEASE_TAG" -f sha="$env:GITHUB_SHA"
              if ($LASTEXITCODE -ne 0) { throw "Could not create version tag." }
            }
            gh release create "$env:RELEASE_TAG" --title "Project Stratagem $env:RELEASE_TAG" --notes "Chess king identity, redesigned command center, and streamlined direct connection setup." --prerelease
            if ($LASTEXITCODE -ne 0) { throw "Could not create GitHub Release." }
          }
          gh release upload "$env:RELEASE_TAG" dist/Project-Stratagem.exe dist/Project-Stratagem-Windows-Portable.zip dist/README.txt --clobber
          if ($LASTEXITCODE -ne 0) { throw "Could not upload release assets." }
