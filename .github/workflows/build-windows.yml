name: Build Project Stratagem Windows App

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    tags:
      - "0.*"
      - "v0.*"
    branches:
      - main

permissions:
  contents: write

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check Rust project
        run: cargo check --release

      - name: Run tests
        run: cargo test --release

      - name: Build Windows GUI executable
        run: cargo build --release

      - name: Package portable app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/Project-Stratagem.exe dist/Project-Stratagem.exe
          Copy-Item README.md dist/README.txt
          Compress-Archive -Path dist/Project-Stratagem.exe, dist/README.txt -DestinationPath dist/Project-Stratagem-Windows-Portable.zip -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Project-Stratagem-Windows-Portable
          path: dist/*
          retention-days: 30

      - name: Create release and attach app assets
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: pwsh
        run: |
          gh release view "$env:RELEASE_TAG" --json tagName 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create "$env:RELEASE_TAG" --title "Project Stratagem $env:RELEASE_TAG" --notes "Native Windows desktop app. See README for setup." --prerelease
            if ($LASTEXITCODE -ne 0) { throw "Could not create GitHub Release." }
          }
          gh release upload "$env:RELEASE_TAG" dist/Project-Stratagem.exe dist/Project-Stratagem-Windows-Portable.zip dist/README.txt --clobber
          if ($LASTEXITCODE -ne 0) { throw "Could not upload release assets." }
