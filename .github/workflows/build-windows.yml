name: Build Project Stratagem (Rust / Windows)

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check Rust project
        run: cargo check --release

      - name: Run tests
        run: cargo test --release

      - name: Build Windows executable
        run: cargo build --release

      - name: Stage portable executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/Project-Stratagem.exe dist/Project-Stratagem.exe
          Copy-Item README.md dist/README.txt

      - name: Upload Windows app
        uses: actions/upload-artifact@v4
        with:
          name: Project-Stratagem-Windows
          path: dist/*
          retention-days: 30
